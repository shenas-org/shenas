[project]
name = "shenas-source-imap"
dynamic = ["version"]
description = "Generic IMAP envelope-metadata connector for shenas"
requires-python = ">=3.11"
dependencies = [
    "shenas-source-core",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.entry-points."shenas.sources"]
imap = "shenas_sources.imap.source:ImapSource"

[tool.hatch.version]
source = "vcs"
tag-pattern = "source-imap/v(?P<version>[^+]+)"
raw-options.root = "../../.."
raw-options.git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "source-imap/v*"]

[tool.hatch.build.targets.wheel]
packages = ["shenas_sources"]
