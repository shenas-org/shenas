[project]
name = "shenas-source-proton-mail-bridge"
dynamic = ["version"]
description = "Proton Mail Bridge IMAP connector for shenas"
requires-python = ">=3.11"
dependencies = [
    "shenas-source-imap",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.entry-points."shenas.sources"]
proton-mail-bridge = "shenas_sources.proton_mail_bridge.source:ProtonMailBridgeSource"

[tool.hatch.version]
source = "vcs"
tag-pattern = "source-proton-mail-bridge/v(?P<version>[^+]+)"
raw-options.root = "../../.."
raw-options.git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "source-proton-mail-bridge/v*"]

[tool.hatch.build.targets.wheel]
packages = ["shenas_sources"]
